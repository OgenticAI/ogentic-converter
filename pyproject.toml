[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ogentic-converter"
version = "0.1.0"
description = "Synthetic-replica conversion primitive for the privacy-aware AI pipeline"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "David Oladeji", email = "david@ogentic.ai" },
]
keywords = ["privacy", "synthetic", "conversion", "replica", "data-privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.13"]

[project.urls]
Homepage      = "https://github.com/OgenticAI/ogentic-converter"
Repository    = "https://github.com/OgenticAI/ogentic-converter"
Issues        = "https://github.com/OgenticAI/ogentic-converter/issues"
Changelog     = "https://github.com/OgenticAI/ogentic-converter/blob/main/CHANGELOG.md"
Documentation = "https://github.com/OgenticAI/ogentic-converter#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/ogentic_converter"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
